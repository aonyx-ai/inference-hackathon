[package]
name = "desktop"
version = "0.1.0"
description = "Inference Hackathon desktop app"
authors = ["Aonyx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Opt-in E2E tooling: embeds a cross-platform W3C WebDriver server (port 4445). Never enable for release.
webdriver = ["dep:tauri-plugin-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debug-only agent automation plugin (registration gated behind debug_assertions in lib.rs).
# Not yet on crates.io; pinned to a specific commit since the upstream fork is untrusted and unversioned.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "d5e0b807f14c79de14bac15146fd5e730d4a1b89" }
tauri-plugin-webdriver = { version = "0.2", optional = true }                                                               # E2E-only; gated by the `webdriver` feature.

---
name: End-to-End Tests

# Real-backend E2E: builds the *debug* desktop app (which embeds a
# cross-platform WebDriver server via `tauri-plugin-webdriver`, debug-gated)
# and drives the real webview + real Rust backend with WebdriverIO.
#
# This runs on ubuntu-latest. The Tauri Linux build dependencies (WebKitGTK et
# al.), Rust, Bun, and Just all come from the project's Flox environment — the
# same way the main CI workflow runs its checks — so this stays consistent with
# the rest of the repo. The one thing Flox does not provide is a display: the
# windowed app needs an X server to launch, so we install xvfb and wrap the run.
#
# The same suite also runs locally on macOS (see apps/desktop/TESTING.md) — that
# is the primary developer workflow, since Apple ships no WebDriver for WKWebView
# and the official tauri-driver does not support macOS. A macOS CI runner is
# intentionally omitted here: it adds cost and the macOS value is fast local
# iteration, not gating CI. Add a `runs-on: macos-latest` job later if desired.

"on":
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: WebdriverIO (Linux)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Flox supplies WebKitGTK, Rust, Bun, and Just, but not a virtual display.
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Flox
        uses: flox/install-flox-action@f6002ed63e483f134001de7b4b45be891e00b09f # v2.5.1

      - name: Remove Flox installer (if it exists)
        run: rm -f flox.x86_64-linux.deb

      # `just e2e` builds the debug app with the `webdriver` feature, then runs
      # the WebdriverIO suite against it. xvfb-run gives the windowed app a
      # headless display. The Flox on-activate hook installs JS dependencies.
      - name: Build and run the E2E suite
        uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1.1.1
        with:
          command: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" just e2e

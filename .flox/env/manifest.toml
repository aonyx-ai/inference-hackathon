# Flox manifest version managed by Flox CLI
schema-version = "1.12.0"

[install]
# JavaScript toolchain
bun.pkg-path = "bun"
nodejs.pkg-path = "nodejs"

# Local development tools
git.pkg-path = "git"
git.outputs = "all"
gum.pkg-path = "gum"
just.pkg-path = "just"
just.outputs = "all"
markdownlint-cli.pkg-path = "markdownlint-cli"
parallel.pkg-path = "parallel"
parallel.outputs = "all"
pre-commit.pkg-path = "pre-commit"
pre-commit.outputs = "all"
prettier.pkg-path = "prettier"
taplo.pkg-path = "taplo"
yamllint.pkg-path = "yamllint"
yamllint.outputs = "all"
zizmor.pkg-path = "zizmor"

[vars]

[hook]
on-activate = '''
# On GitHub Actions, unset LD_AUDIT to avoid a "cannot allocate memory in static
# TLS block" error. See https://github.com/flox/flox/issues/1341
if [ -n "$GITHUB_ACTIONS" ]; then
  unset LD_AUDIT
fi

# Install JavaScript dependencies when they are missing so that `just` recipes
# (which run inside this environment) have their tooling available.
if [ ! -d "$FLOX_ENV_PROJECT/node_modules" ]; then
  (cd "$FLOX_ENV_PROJECT" && bun install)
fi
'''

[profile]

[services]

[include]

[build]

[options]
